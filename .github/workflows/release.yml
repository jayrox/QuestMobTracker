name: Package and release

# Runs when a version tag (for example v0.4.24) is pushed.
# Uploads to CurseForge when X-Curse-Project-ID is set in the .toc and the
# CF_API_KEY repository secret exists; GitHub releases use the built-in token.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CHANGELOG.md keeps the full history; the release page and CurseForge get only the latest few versions.
      - name: Trim changelog for the release
        run: awk '/^## /{n++} n>=1 && n<=3' CHANGELOG.md > RELEASE_CHANGELOG.md
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
